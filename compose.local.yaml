name: scova-local
services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: scova
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run vp run local:init first}
            POSTGRES_DB: scova
        ports:
            - '127.0.0.1:${SCOVA_LOCAL_PG_PORT:-15432}:5432'
        volumes: [postgres-data:/var/lib/postgresql/data]
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U scova -d scova']
            interval: 2s
            timeout: 3s
            retries: 30
        logging: &logging
            driver: json-file
            options: { max-size: 5m, max-file: '2' }
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
        ports:
            - '127.0.0.1:${SCOVA_LOCAL_REDIS_PORT:-16379}:6379'
        volumes: [redis-data:/data]
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 2s
            timeout: 3s
            retries: 30
        logging: *logging
    searxng:
        extends:
            file: compose.search.yaml
            service: searxng
volumes:
    postgres-data:
    redis-data:
    searxng-cache:
