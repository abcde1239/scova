services:
    searxng:
        image: ghcr.io/searxng/searxng@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
        restart: unless-stopped
        user: '977:977'
        ports:
            - '127.0.0.1:${SCOVA_SEARXNG_PORT:-8080}:8080'
        # An inactive Compose profile must be renderable without a search secret.
        entrypoint:
            - /bin/sh
            - -ec
            - |
                case "$${SEARXNG_SECRET:-}" in
                    ''|ultrasecretkey|replace_with_a_random_search_secret)
                        echo 'Set a random SEARXNG_SECRET before enabling SearXNG.' >&2
                        exit 1 ;;
                esac
                exec /usr/local/searxng/entrypoint.sh "$$@"
            - --
        environment:
            SEARXNG_SECRET: '${SEARXNG_SECRET:-}'
            SEARXNG_BIND_ADDRESS: '0.0.0.0'
            SEARXNG_PORT: '8080'
            FORCE_OWNERSHIP: 'false'
            GRANIAN_WORKERS: '1'
            GRANIAN_BLOCKING_THREADS: '2'
        volumes:
            - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
            - ./ops/searxng/bing_international.py:/usr/local/searxng/searx/engines/bing_international.py:ro
            - searxng-cache:/var/cache/searxng
        mem_limit: 512m
        cpus: 1.0
        pids_limit: 128
        healthcheck:
            test:
                [
                    'CMD',
                    '/usr/local/searxng/.venv/bin/python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        logging:
            driver: json-file
            options:
                max-size: '5m'
                max-file: '2'

volumes:
    searxng-cache:
