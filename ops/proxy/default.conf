server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;
  root /usr/share/nginx/html;

  # Raw avatar uploads are bounded again by the authenticated API handler.
  location = /api/v1/me/avatar {
    client_max_body_size 5m;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_ignore_client_abort off;
  }

  location ~ ^/api/v1/reports/[^/]+/attachments$ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_ignore_client_abort off;
  }

  # API, SSE and service metadata must never enter SPA fallback or static caching.
  location ~ ^/(api(?:/|$)|health(?:/|$)|swagger(?:/|$)) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_ignore_client_abort off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Vite assets are content hashed. Missing assets remain 404, never HTML.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ \.[^/]+$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
