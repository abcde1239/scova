packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# Native esbuild scripts are unnecessary: Vite+ provides the build toolchain.
allowBuilds:
  esbuild: false
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  msgpackr-extract: false

catalog:
  "@langchain/core": ^1.3.0
  "@mozilla/readability": ^0.6.0
  "@elysiajs/node": ^1.4.5
  "@js-temporal/polyfill": ^0.5.1
  "@langchain/langgraph": ^1.5.2
  "@langchain/langgraph-checkpoint-postgres": ^1.1.2
  "@node-rs/argon2": ^2.2.2
  "@prisma/client": 6.19.0
  "@types/node": ^24
  "@types/jsdom": ^30.0.0
  "@types/pg": ^8.23.1
  "@vitejs/plugin-vue": ^6.0.10
  bullmq: ^6.4.0
  ajv: ^8.20.0
  ioredis: ^6.0.0
  jsdom: ^26.1.0
  pg: ^8.23.1
  prisma: 6.19.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vue: ^3.5.44
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
