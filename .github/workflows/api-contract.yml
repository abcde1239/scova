name: API 中文契约
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    openapi:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version: '24.22.1'
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: '1.3.4'
            - run: vp exec prisma generate
            - run: vp run api:openapi:check
            - run: vp test packages/models/tests/contracts.test.ts apps/server/tests/openapi.test.ts
            - run: vp run test:processes
