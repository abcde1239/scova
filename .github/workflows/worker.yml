name: 后端集成验证
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: scova_test
                    POSTGRES_PASSWORD: scova_test
                    POSTGRES_DB: scova_test
                ports: ['55432:5432']
                options: >-
                    --health-cmd "pg_isready -U scova_test -d scova_test"
                    --health-interval 5s --health-timeout 5s --health-retries 10
            redis:
                image: redis:7-alpine
                ports: ['56379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version: '24.22.1'
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: '1.3.4'
            - name: Install PostgreSQL backup tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes postgresql-client
                  pg_dump --version
            - run: pg_dump --version && pg_restore --version
            - name: Verify backend and contracts
              run: vp run ready
