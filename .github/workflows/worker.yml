name: Worker 验证
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scova_test
          POSTGRES_PASSWORD: scova_test
          POSTGRES_DB: scova_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U scova_test -d scova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.4"
      - run: vp exec prisma generate
      - run: vp test apps/worker/tests/lifecycle.test.ts apps/worker/tests/config.test.ts
      - run: vp run worker#build
      - run: vp run test:worker
